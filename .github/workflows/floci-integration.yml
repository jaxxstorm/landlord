name: Floci Integration Tests

on:
  pull_request:
  push:

jobs:
  floci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
      - run: make test-floci

  floci-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
      - run: make test-floci-e2e
