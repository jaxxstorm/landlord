# Docker Compose configuration for Temporal local testing

database:
  provider: postgres
  host: postgres
  port: 5432
  user: landlord
  password: landlord_password
  database: landlord_db
  ssl_mode: disable
  max_connections: 25
  min_connections: 5
  connect_timeout: 10s
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 30s

log:
  level: debug
  format: development

compute:
  docker:
    image: "nginx:latest"
    host: ""
    network_name: bridge
    network_driver: bridge
    label_prefix: landlord

workflow:
  default_provider: temporal
  temporal:
    host_port: temporal:7233
    namespace: default
    task_queue: landlord
    timeout: 30m
    retry_attempts: 3

controller:
  enabled: true
  reconciliation_interval: 10s
  status_poll_interval: 10s
  workers: 3
  workflow_trigger_timeout: 30s
  shutdown_timeout: 30s
  max_retries: 5
  workflow_provider: temporal
